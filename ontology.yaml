# Онтология проекта: риды и их качество, городские почвы Москвы (16S рРНК, V4–V5).

ontology: Риды и их качество — почвы Москвы
goal: >
  Граф проекта отвечает на вопросы, какие образцы и файлы с ридами есть в проекте, сколько
  в них ридов и какого они качества, каким методом, экспериментом и проверкой это получено
  и какой отчёт на этом основан, а также на какие источники опираются метод и отчёт.
  Пользуются им исследователь (сверяет числа), агент
  (продолжает работу по статусам задач) и рецензент (прослеживает каждое число отчёта до файла).

# Каждый класс и каждое отношение нужны хотя бы одному вопросу (номер — в комментарии).
competency_questions:
  - Какие образцы входят в набор сырых ридов, какие из них почвенные, а какой — отрицательный контроль?   # 1
  - В каком файле лежат риды образца и в какой таблице записано число его ридов?                         # 2
  - Каким экспериментом и каким методом получен результат (число ридов, сводка качества, сравнение), чем он проверен и на какие источники опирается метод?   # 3
  - Какие задачи и подзадачи выполнены, чем они закрыты (эксперимент, проверка, отчёт), какие в работе или заблокированы?   # 4
  - На каких результатах и источниках основан отчёт, в каких файлах лежат его числа и тексты источников; кто авторы источника, кого он цитирует, каким запросом к внешнему графу найден и открыт ли доступ к нему (oa_status)?   # 5

# Классы — множества объектов. Экземпляры (образец Kr1_S80, таблица чисел ридов) — в notes/.
classes:
  Образец:
    parent: null
    definition: проба, у которой в манифесте есть sample-id (почвенная проба или отрицательный контроль); вопросы 1, 2
  НаборДанных:
    parent: null
    definition: совокупность ридов нескольких образцов, взятая в работу как одно целое (сырые fastq или импортированный артефакт); вопросы 1, 3
  Метод:
    parent: null
    definition: способ получения результата из набора данных — скрипт или команда QIIME 2; вопрос 3
  Эксперимент:
    parent: null
    definition: запуск метода на наборе данных, который даёт результат; вопросы 3, 4
  Результат:
    parent: null
    definition: таблица, число или артефакт, полученные в эксперименте (числа ридов, сводка качества, сравнение с медианой); вопросы 2, 3, 5
  Проверка:
    parent: null
    definition: независимая сверка результата или отчёта другой командой или скриптом, с известным исходом; вопросы 3, 4
  Отчёт:
    parent: null
    definition: текст reports/<название>.md, написанный по просьбе человека, каждое число которого взято из результата; вопросы 4, 5
  Задача:
    parent: null
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Файл:
    parent: null
    definition: файл проекта — таблица, код, fastq, артефакт QIIME 2, текст источника; узел графа — сам файл
  ИнформационныйОбъект:
    parent: null
    definition: "объект, несущий содержание, а не действие: опубликованная работа; вопрос 5"
  Процесс:
    parent: null
    definition: "действие, которое произошло в определённый момент и оставило след: обращение к внешнему графу; вопрос 5"
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/; вопросы 3, 5
  Автор:
    parent: null
    definition: человек — автор опубликованной работы; вопрос 5
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей; вопрос 5

# Отношения: domain — класс источника связи, range — класс цели.
properties:
  входитВ:        {domain: Образец, range: НаборДанных}                       # вопрос 1
  применяет:      {domain: Эксперимент, range: Метод}                         # вопрос 3
  использует:     {domain: Эксперимент, range: НаборДанных}                   # вопрос 3
  даёт:           {domain: Эксперимент, range: Результат}                     # вопрос 3
  характеризует:  {domain: Результат, range: Образец}                         # вопрос 2
  проверенЧерез:  {domain: Результат, range: Проверка}                        # вопрос 3
  основанНа:      {domain: Отчёт, range: Результат}                           # вопрос 5
  решает:         {domain: [Эксперимент, Проверка, ЗапросКГрафу], range: Задача}   # вопрос 4
  выполняет:      {domain: Отчёт, range: Задача}                              # вопрос 4
  хранитсяВ:      {domain: [Образец, НаборДанных, Метод, Результат, Источник], range: Файл}   # вопросы 2, 5
  подзадачаОт:    {domain: Задача, range: Задача, characteristics: [транзитивное]}  # вопрос 4
  # Источники и предметная часть графа
  опираетсяНа:    {domain: [Метод, Отчёт], range: Источник}                   # вопросы 3, 5
  найденЗапросом: {domain: Источник, range: ЗапросКГрафу}                     # вопрос 5
  написан:        {domain: Источник, range: Автор}                            # вопрос 5
  цитирует:       {domain: Источник, range: Источник}                         # вопрос 5

# Атрибуты — поле в начале заметки со значением из списка.
attributes:
  status: {domain: Задача, values: [открыта, в работе, выполнена, заблокирована, принята]}
  role:   {domain: Образец, values: [почва, отрицательный контроль]}
  oa_status: {domain: Источник, values: [diamond, gold, hybrid, green, bronze, closed]}

# Правила. Определяемые классы (ПочвенныйОбразец, ОтрицательныйКонтроль, ПроверенныйРезультат,
# ВыполненнаяЗадача) скрипт выводит из графа.
rules:
  - id: П1
    text: каждый результат получен в каком-либо эксперименте
    dl: "Результат ⊑ ∃даёт⁻.Эксперимент"
    check: {kind: some_inverse, class: Результат, property: даёт, source: Эксперимент}
  - id: П2
    text: каждый образец входит в набор данных
    dl: "Образец ⊑ ∃входитВ.НаборДанных"
    check: {kind: some, class: Образец, property: входитВ, target: НаборДанных}
  - id: П3
    text: у каждого образца есть файл с ридами R1
    dl: "Образец ⊑ ∃хранитсяВ.Файл"
    check: {kind: some, class: Образец, property: хранитсяВ, target: Файл}
  - id: П4
    text: каждый отчёт основан хотя бы на одном результате
    dl: "Отчёт ⊑ ∃основанНа.Результат"
    check: {kind: some, class: Отчёт, property: основанНа, target: Результат}
  - id: П5
    text: проверенный результат — результат, прошедший проверку
    dl: "ПроверенныйРезультат ≡ Результат ⊓ ∃проверенЧерез.Проверка"
    check: {kind: defined, name: ПроверенныйРезультат, class: Результат, property: проверенЧерез, target: Проверка}
  - id: П6
    text: почвенный образец — образец с ролью «почва»
    dl: "ПочвенныйОбразец ≡ Образец ⊓ ∃role.{почва}"
    check: {kind: defined_value, name: ПочвенныйОбразец, class: Образец, property: role, values: [почва]}
  - id: П7
    text: отрицательный контроль — образец с ролью «отрицательный контроль»
    dl: "ОтрицательныйКонтроль ≡ Образец ⊓ ∃role.{отрицательный контроль}"
    check: {kind: defined_value, name: ОтрицательныйКонтроль, class: Образец, property: role, values: [отрицательный контроль]}
  - id: П8
    text: выполненная задача — задача со статусом «выполнена» или «принята»
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check: {kind: defined_value, name: ВыполненнаяЗадача, class: Задача, property: status, values: [выполнена, принята]}
  - id: П9
    text: выполненную задачу закрывает эксперимент, проверка, отчёт или её подзадачи
    dl: "ВыполненнаяЗадача ⊑ ∃решает⁻.⊤ ⊔ ∃выполняет⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤"
    check: {kind: some_inverse_any, class: ВыполненнаяЗадача, properties: [решает, выполняет, подзадачаОт]}
  - id: П10
    text: задача выполнена, только если выполнены все её подзадачи
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check: {kind: all_inverse, class: ВыполненнаяЗадача, property: подзадачаОт, source: ВыполненнаяЗадача}
  - id: П11
    text: у выполненной задачи есть раздел «Итог»
    dl: "— (оформление)"
    check: {kind: section, class: ВыполненнаяЗадача, title: Итог}
  - id: Л1
    text: каждый источник указывает запрос к внешнему графу, которым он найден или сверен
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
    check: {kind: some, class: Источник, property: найденЗапросом, target: ЗапросКГрафу}
  - id: Л2
    text: у каждого источника записан хотя бы один автор
    dl: "Источник ⊑ ∃написан.Автор"
    check: {kind: some, class: Источник, property: написан, target: Автор}
