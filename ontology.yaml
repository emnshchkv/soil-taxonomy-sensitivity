    authorization: 'Ответ пользователя о необходимости расширения онтологии для будущей статьи: да'
    classes:
    - Праймер
    - ASV
    - МодельКлассификатора
    - ТаксономическоеНазначение
    - ТаксономическийПрофиль
    - СообщениеИсследователя
    rules:
    - Т1
    - Т2
    - Т3
    - Т4
    - Т5
    instance_notes:
    - Праймер Next_515F
    - Праймер Next_806R
    - Модель sklearn_silva138
